<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CSS aspect-ratio verification harness</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #05080f; color: #e6edf6; font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .grid { display: flex; flex-direction: column; gap: 20px; padding: 22px; align-items: flex-start; }
  .cell { background: #0b1322; border: 1px solid #1f3047; border-radius: 10px; padding: 10px; box-sizing: border-box; max-width: 100%; }
  .cell h2 { margin: 0 0 8px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #ff922b; }
  .shot { position: relative; overflow: hidden; border-radius: 6px; border: 1px solid #23364f; }
  .shot iframe { border: 0; transform-origin: top left; display: block; background: #08111f; }
  .hint { padding: 10px 22px 0; color: #7a90a4; }
</style>
</head>
<body>
<div class="hint">Each frame below is a real viewport of the listed size, scaled to fit, loading <code>style.css</code> + <code>mobile.css</code> exactly as app.py injects them.</div>
<div class="grid" id="grid"></div>

<script>
// viewport size + a display scale cap (frames are always shrunk to fit the viewer)
const DEVICES = [
  { label: "32:9 super-wide 5120x1440", w: 5120, h: 1440, cap: 0.20 },
  { label: "21:9 ultra-wide 3440x1440", w: 3440, h: 1440, cap: 0.30 },
  { label: "16:9 desktop 1920x1080", w: 1920, h: 1080, cap: 0.42 },
  { label: "16:9 short laptop 1366x768", w: 1366, h: 768, cap: 0.52 },
  { label: "portrait monitor 1080x1400", w: 1080, h: 1400, cap: 0.40 },
  { label: "tall phone 390x844", w: 390, h: 844, cap: 0.42 },
  { label: "landscape phone 844x390", w: 844, h: 390, cap: 0.52 },
  { label: "boot splash 1280x720", w: 1280, h: 720, cap: 0.45, mode: "splash" },
];

const isEmbed = new URLSearchParams(location.search).has("embed");
const paneWidth = () => Math.max(300, document.documentElement.clientWidth - 90);

function layout() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const { label, w, h, cap, mode } of DEVICES) {
    const s = Math.min(cap, paneWidth() / w);          // always fits the viewer
    const src = "?embed=1" + (mode ? `&mode=${mode}` : "");
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerHTML = `<h2>${label} <span style="color:#7a90a4">(x${s.toFixed(2)})</span></h2>
      <div class="shot" style="width:${Math.round(w * s)}px;height:${Math.round(h * s)}px">
      <iframe src="${src}" width="${w}" height="${h}" loading="lazy" style="transform:scale(${s})"></iframe></div>`;
    grid.appendChild(cell);
  }
}

if (!isEmbed) {
  layout();
  addEventListener("resize", layout);
}
</script>

<script>
  if (isEmbed) {
    const mode = new URLSearchParams(location.search).get("mode");
    document.body.innerHTML = (mode === "splash"
      ? document.getElementById("splash-source").innerHTML
      : document.getElementById("mock-source").innerHTML);
    document.body.classList.add("embed");
    if (mode === "splash") document.body.classList.add("splash");
    const vars = document.createElement("style");
    // Mirrors apply_theme("Dark") in app.py so var(--...) resolves here too.
    vars.textContent = `:root{--background-color:#08111f;--panel-color:#101b2f;--text-color:#f8f9fa;--muted-color:#7a90a4;--border-color:#1f3047;--shadow-color:rgba(0,0,0,0.4);}
      /* Streamlit keeps the sidebar as a fixed rail and offsets the main area, and
         collapses it entirely below 768px — mirror both so phone frames are honest. */
      .mock-dashboard{min-height:100%;}
      .mock-sidebar{position:fixed;top:0;left:0;bottom:0;width:260px;overflow:auto;}
      .mock-main{margin-left:260px;min-width:0;}
      @media screen and (max-width:768px){ .mock-sidebar{display:none;} .mock-main{margin-left:0;} }
      .mock-row{display:flex;flex-wrap:wrap;gap:1rem;align-items:stretch;margin-bottom:1rem;}
      .mock-col{min-width:0;box-sizing:border-box;}
      .mock-select{background:var(--panel-color);border:1px solid var(--border-color);border-radius:6px;padding:8px 10px;}
      .mock-button{background:#ff4b4b;border:0;border-radius:8px;color:#fff;padding:10px 14px;font:inherit;}
      .mock-metrics{display:grid;grid-template-columns:auto auto;gap:8px 18px;margin-top:18px;}
      .mock-sidebar h2{font-size:1.1rem;}
      body.embed{margin:0;padding:0;background:var(--background-color);color:var(--text-color);}
      /* Keep the splash pinned open so its design is inspectable in a still frame. */
      body.embed.splash .boot-splash{animation:none !important;opacity:1 !important;visibility:visible !important;}`;
    document.head.appendChild(vars);
  }
</script>

<!-- Real stylesheets, in the same order app.py injects them: style.css then mobile.css -->
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="mobile.css" />
<script>
  // The harness exists to check CSS as it is being edited, so never reuse a
  // cached copy: re-request both sheets with a per-load cache buster.
  document.querySelectorAll('link[rel="stylesheet"]').forEach((link) => {
    link.href = link.href.split("?")[0] + "?v=" + Date.now();
  });
</script>
<script>
  // Report stylesheet load status so a failure is obvious rather than silently unstyled.
  window.addEventListener("load", () => {
    const status = [...document.styleSheets].map((s) => {
      let ok = "loaded";
      try { void s.cssRules.length; } catch (e) { ok = "CORS?"; }
      return `${s.href ? s.href.split("/").pop() : "inline"}:${ok}:${s.cssRules ? s.cssRules.length : "?"}`;
    });
    document.title = "sheets => " + status.join(" | ");
    console.log("[harness] stylesheets:", status.join(" | "), "| viewport", innerWidth + "x" + innerHeight);
  });
</script>
